[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "svdd-features"
version = "0.1.0"
description = "Reproducible NetFlow feature selection and Deep SVDD input contract"
requires-python = ">=3.11"
dependencies = ["numpy==2.4.6", "pandas==2.3.3", "scipy==1.17.1", "scikit-learn==1.8.0", "matplotlib==3.11.2"]

[project.optional-dependencies]
test = ["pytest==9.0.3"]
software = ["torch==2.12.0"]

[project.scripts]
svdd-features = "svdd_features.workflow:main"
svdd-baseline = "svdd_baseline.run:main"

[tool.setuptools.packages.find]
include = ["svdd_features*", "svdd_baseline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
